<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="about" id="about" class="about">

  <img class="about-bg" th:src="@{/images/about-bg.jpg}" alt="" aria-hidden="true"
       onerror="this.style.display='none'">

  <div class="container about-inner">
    <p class="about-eyebrow">About Me</p>

    <h2 class="about-title">
      <span class="about-name" th:text="${about?.name} ?: '이름'"></span>
      <span>개발자 포트폴리오</span>
    </h2>

    <span class="about-divider" aria-hidden="true"></span>
    
    <div class="about-intro">
      <p>안녕하세요.</p>
      <p>문제의 본질을 파악하고 목적에 맞는 해결책을 고민하며 설계하는 백엔드 개발자입니다.</p>
    </div>
    
    <ul class="contact-list">
      <li th:if="${about?.phone}">
        <div class="contact-card">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/>
            </svg>
          </span>
          <span class="contact-text">
            <span class="contact-label">Phone</span>
            <span class="contact-value" th:text="${about.phone}"></span>
          </span>
        </div>
      </li>

      <li th:if="${about?.email}">
        <div class="contact-card">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 7l9 6l9 -6"/>
            </svg>
          </span>
          <span class="contact-text">
            <span class="contact-label">Email</span>
            <span class="contact-value" th:text="${about.email}"></span>
          </span>
        </div>
      </li>

      <li th:each="link : ${links}">
        <a class="contact-card contact-card-link" th:href="${link.url}" target="_blank" rel="noopener noreferrer">
          <span class="contact-icon" th:classappend="${link.icon} ? 'has-img'" aria-hidden="true">
            <img th:if="${link.icon}" th:src="${link.icon}" alt="">
            <svg th:unless="${link.icon}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 15l6 -6"/>
              <path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464"/>
              <path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463"/>
            </svg>
          </span>
          <span class="contact-text">
            <span class="contact-label" th:text="${link.title}">GitHub</span>
            <span class="contact-value" th:text="${link.description}">소스 코드 저장소</span>
          </span>
          <span class="contact-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 6l6 6-6 6"/>
            </svg>
          </span>
        </a>
      </li>
    </ul>
  </div>

  <a href="#skills" class="about-scroll" aria-label="다음 섹션으로 이동">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 5v14"/>
      <path d="M6 13l6 6l6 -6"/>
    </svg>
  </a>
</section>
</body>
</html>
