<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="links" id="links" class="section links" aria-label="Links">
  <div class="link-marquee" th:unless="${#lists.isEmpty(links)}">
    <div class="link-track">
      <ul class="link-group">
        <li class="link-item" th:each="link : ${links}">
          <a class="card link-card" th:href="${link.url}" target="_blank" rel="noopener noreferrer"
             th:data-link-id="${link.linkCardId}">

            <div class="link-card-head">
              <span class="link-card-icon" aria-hidden="true">
                <img th:if="${link.icon}" th:src="${link.icon}" alt="">
                <svg th:unless="${link.icon}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 15l6 -6"/>
                  <path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464"/>
                  <path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463"/>
                </svg>
              </span>
              <h3 class="link-card-title" th:text="${link.title}"></h3>
            </div>

            <p class="link-card-url" th:text="${#strings.replace(#strings.replace(link.url, 'https://', ''), 'http://', '')}">example.com</p>

            <p class="link-card-desc" th:text="${link.description}"></p>

            <span class="link-card-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 6l6 6-6 6"/>
              </svg>
            </span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="container" th:if="${#lists.isEmpty(links)}">
    <p class="empty-text"></p>
  </div>
</section>
</body>
</html>
