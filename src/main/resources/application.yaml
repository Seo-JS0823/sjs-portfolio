spring:
  application:
    name: pofol
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PGS_HOST:localhost}:${PGS_PORT:5432}/${PGS_DB}
    username: ${PGS_USER}
    password: ${PGS_PASSWORD}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
            trust: ${MAIL_HOST:localhost}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          
server:
  servlet:
    session:
      timeout: 60m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        
admin:
  email: ${ADMIN_EMAIL}
  
