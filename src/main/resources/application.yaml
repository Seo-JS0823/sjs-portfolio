spring:
  application:
    name: pofol
  config:
    import: optional:file:../.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${PGS_USER}
    password: ${PGS_PASSWORD}
    url: jdbc:postgresql://localhost:5432/${PGS_DB}
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          ssl:
            enable: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          
server:
  servlet:
    session:
      timeout: 60m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

admin:
  email: ${ADMIN_EMAIL:}

